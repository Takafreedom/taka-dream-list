button{font-family:inherit;touch-action:manipulation}
.shell{max-width:620px;box-shadow:0 0 70px #0007}
.head{min-height:330px;padding-top:max(27px,env(safe-area-inset-top));}
.sky{background-position:center 39%}
.head:after{content:'';position:absolute;right:-50px;top:20px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#70d3ff3d,transparent 70%);pointer-events:none}
.grid{gap:12px}
.dream{min-height:225px;border-radius:19px;border-color:#9ddfff91;box-shadow:0 10px 24px #00132e8c;transition:transform .18s ease,filter .18s ease}
.dream:active{transform:scale(.96);filter:brightness(1.12)}
.dream:before{content:'↗';position:absolute;right:10px;top:9px;z-index:3;border:1px solid #ffffff77;background:#02244991;backdrop-filter:blur(5px);border-radius:50%;display:grid;place-items:center;width:27px;height:27px;font-size:16px}
.num{font-size:27px}
.cardbottom{bottom:12px;left:11px;right:11px}
.cardbottom b{font-size:13px;letter-spacing:.005em}
.chip,.status{font-size:9px}
.tagline{letter-spacing:.02em}
.filter{min-height:39px}
.footer{max-width:620px}
.overlay{padding:0;align-items:end}
.modal{width:100%;max-width:620px;max-height:94dvh;border-radius:26px 26px 0 0;border-bottom:0;animation:sheetup .3s cubic-bezier(.17,.77,.25,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetup{from{transform:translateY(100%);opacity:.6}to{transform:translateY(0);opacity:1}}
.modalpic{height:min(46dvh,410px)}
.modalbody{padding:0 22px 28px}
.modal h2{font-size:clamp(22px,6vw,29px)}
.close{width:45px;height:45px;font-size:26px;right:16px;top:16px}
.primary,.secondary{min-height:48px}
.pager button{min-height:44px}
@media(min-width:700px){.shell{max-width:620px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{padding:30px 25px;min-height:345px}.dream{min-height:290px}.content{padding-inline:20px}.portrait{width:115px;height:115px}.modal{border-radius:26px;max-height:90vh}.overlay{align-items:center;padding:20px}.modalpic{height:330px}}
@media(max-width:370px){.dream{min-height:195px}.cardbottom b{font-size:12px}}
@media(prefers-reduced-motion:reduce){.dream,.modal{transition:none;animation:none}html{scroll-behavior:auto}}

String(d.id).padStart(2,'0')} / 20 · ${d.category}`;document.getElementById('modalTitle').textContent=d.title;document.getElementById('modalDesc').textContent=d.description;document.getElementById('achieveBtn').textContent=completed.has(d.id)?'✓ 達成済み（タップで解除）':'○ この夢を達成済みにする';document.getElementById('overlay').classList.add('show');document.body.style.overflow='hidden'}function closeDream(){document.getElementById('overlay').classList.remove('show');document.body.style.overflow=''}function toggleAchieved(){let id=dreams[current].id;if(completed.has(id))completed.delete(id);else completed.add(id);save();render();openDream(current)}function stepDream(diff){openDream((current+diff+dreams.length)%dreams.length)}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDream()});document.addEventListener('keydown',e=>{if(!document.getElementById('overlay').classList.contains('show'))return;if(e.key==='Escape')closeDream();if(e.key==='ArrowRight')stepDream(1);if(e.key==='ArrowLeft')stepDream(-1)});render();
